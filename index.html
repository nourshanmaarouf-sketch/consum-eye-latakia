.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}

.fab{position:fixed;left:max(14px,calc(50% - 246px));bottom:84px;background:#fff;color:var(--dk);border:2px solid var(--dk);border-radius:99px;padding:10px 16px;font-weight:800;font-size:15px;text-decoration:none;display:flex;gap:6px;align-items:center;box-shadow:0 3px 10px #0003;z-index:5}
.fab.lo{bottom:18px}
nav{display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0);z-index:6}

.hide{display:none}.dot{width:44px;height:44px;border-radius:12px;background:#e8f5e9;display:grid;place-items:center;color:var(--gr);flex:none}
.ov{position:fixed;inset:0;background:#000000e6;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}.ov.hide{display:none}

const card=i=>{const o=over(i);return`<div class="card ${o?'bad':''}"><div class="row"><div><h2>${i.n} <span class="sub">(${i.u})</span></h2><div class="sub" style="${o?'color:var(--red)':''}">${i.d}${i.bc?' · باركود '+i.bc:''}</div></div><span class="tag ${o?'w':''}">${o?'تجاوز طفيف':'ملتزم بالسعر'}</span></div><div class="pr"><div><span>${i.L}</span><b>${fmt(i.cap)} <small>ل.س</small></b></div><div><span>${o?'سعر السوق المسجل':'سعر التجزئة المرصود'}</span><b style="color:${o?'var(--red)':'var(--gr)'}">${fmt(last(i))} <small>ل.س</small></b></div></div></div>`};
const S={
login:()=>`<div class="row" style="margin-bottom:12px"><h2>حدد صفة الاستخدام</h2></div><div class="roles">${[['retail','bag','تاجر تجزئة','لوائح الأسعار اليومية'],['home','user','خدمة المواطنين','استعلام عن الأسعار الرسمية'],['supervision','shield','المراقبة التموينية','متابعة تطور الأسعار'],['wholesale','store','مورد / تاجر جملة','فواتير وتدفق التوريد']].map(r=>`<button class="role ${st.role==r[0]?'on':''}" data-role="${r[0]}">${ic(r[1],28)}<div><b>${r[2]}</b><small>${r[3]}</small></div></button>`).join('')}</div>
<div class="card"><label style="margin-top:0">رقم الهاتف المحمول</label><input inputmode="tel" placeholder="أدخل رقم الهاتف المحمول (مثال: 09XXXXXXXX)"><label>كلمة المرور / الرمز السري</label><input type="password" value="12345678"><div class="sub" style="margin:10px 0 14px">إبقاء الجلسة نشطة وموثقة على هذا الجهاز</div><button class="btn" style="margin:0" id="go">تسجيل الدخول إلى المنظومة</button><div class="sub" style="text-align:center;margin:14px 0">أو خيارات الوصول السريع</div><button class="srch" style="width:100%;justify-content:center;font:inherit;color:var(--tx)" data-go="home">دخول حر للمواطنين (تصفح دليل الأسعار فقط)</button></div>
<button class="srch" id="rst" style="width:100%;justify-content:center;font:inherit;font-size:12px">إعادة ضبط البيانات التجريبية</button><div class="card" style="background:#fff"><b>غرفة العمليات المركزية والدعم الفني</b><div class="sub">جاهزة على مدار 24 ساعة لبلاغات الأسواق</div></div>`,
home:()=>`<div class="row" style="margin-bottom:14px"><div><h2>دليل الأسعار والتحقق الذكي</h2><div class="sub">المرجعية التموينية المعتمدة - محافظة اللاذقية</div></div><span class="tag">خدمة المواطنين</span></div>
<div class="srch">${ic('search')}<input id="q" placeholder="ابحث بالاسم أو رقم الباركود..."></div>
<button class="btn" id="scan">${ic('cam')} تصوير المادة / الرمز للتحقق من السعر</button>
<div class="card" style="background:#f1f4f1;padding:12px"><span class="sub">نشرة الأسعار رقم 42 الصادرة بقرار المكتب التنفيذي - <b>اللاذقية</b></span></div>
<div id="lst">${IT.map(card).join('')}</div>${chart()}
<a class="btn red" href="tel:119"><span>للشكاوى التموينية اتصل بالرقم 119<small>خدمة هاتفية مباشرة</small></span>${ic('phone',28)}</a>`,
retail:()=>`<div class="card"><div class="row"><div class="dot">${ic('store')}</div><div style="flex:1"><h2>منصة تسجيل أسعار التجزئة والأسواق</h2></div><span class="tag">دائرة رقابة الأسواق</span></div></div>
<div class="card"><h2>بيانات المادة التموينية واعتماد السعر</h2><label>اختر المادة / الصنف *</label><select id="ri">${IT.map((x,k)=>`<option value="${k}">${x.n}</option>`).join('')}</select><label>حدد المتجر أو المركز التمويني المعتمد *</label><select><option>ماركت العثمان - حي الشيخ ضاهر (سجل ت: 4892)</option><option>سوبرماركت الشاطئ - الزراعة (سجل ت: 3170)</option></select><label>سعر البيع النهائي للمستهلك (ل.س) *</label><input id="rp" inputmode="numeric" value="22000"><div class="card" style="background:#f0fdf4;border-color:#bbf7d0;margin:14px 0;padding:12px;font-size:13px">يُشترط التقيّد بالتسعيرة التأشيرية المحددة بالنشرة الدورية الأخيرة الصادرة برقم (47/ت) تحت طائلة تنظيم الضبط رقم (8).</div><button class="btn" id="sv" style="margin:0">${ic('check')} اعتماد سعر التجزئة وتوثيقه</button></div>
${st.done?st.done:''}`,
wholesale:()=>`<div class="card row"><div class="dot">${ic('store')}</div><div style="flex:1"><h2>قاعدة بيانات أسعار الجملة والتوريد</h2><div class="sub">سجلات التسعير المركزي رقم 402</div></div></div>
<button class="btn" id="addw">${ic('plus')} تحديث سعر الجملة / مادة جديدة</button>${st.wf?wform():''}
<div class="kp"><div class="k"><span>المواد الموردة</span><b>${IT.length} <small>مادة</small></b></div><div class="k g"><span>الموردون المعتمدون</span><b>18 <small>شركة</small></b></div><div class="k g"><span>التحديثات اليومية</span><b>7 <small>إشعارات</small></b></div><div class="k a"><span>قيد التدقيق التمويني</span><b>2 <small>سجلات</small></b></div></div>
<div class="srch">${ic('search')}<input placeholder="البحث عن مادة تموينية أو شركة موردة..."></div>
<div class="chips">${['جميع المواد ('+IT.length+')','مواد غذائية أساسية','حبوب وبقوليات','زيوت وسُمون'].map((c,k)=>`<button class="chip ${k==st.cat?'on':''}" data-cat="${k}">${c}</button>`).join('')}</div>
${IT.filter(i=>!st.cat||i.cat==st.cat).map(i=>`<div class="card"><div class="row"><div><h2>${i.n}</h2><div class="sub">${i.co}</div></div><span class="tag ${i.aud?'a':''}">${i.aud?'قيد التدقيق':'معتمد'}</span></div><div class="pr" style="grid-template-columns:auto 1fr;align-items:center"><span>2025/10/26</span><b style="text-align:left;font-size:16px"><span style="display:inline;font-weight:400">${i.aud?'سعر الجملة المقترح':'سعر الجملة الرسمي للمستودع'}:</span> ${i.wp} ل.س / ${i.u.includes('لتر')?'لتر':'كغ'}</b></div></div>`).join('')}`,
supervision:()=>`<div class="hero"><small>● نظام الرصد والتحكم الميداني المباشر</small><h2>لوحة المراقبة والإشراف</h2><p>دائرة الأسعار والرقابة التموينية • السجل الميداني المؤتمت</p></div>
<div class="kp"><div class="k"><span>المواد المراقبة</span><b>18 <small>سلعة أساسية</small></b><small style="color:var(--gr)">تغطية تامة للتسعيرة</small></div><div class="k r"><span>متوسط التغير اليومي</span><b>+3.2%</b><small>مؤشر الضغط الاستهلاكي</small></div><div class="k"><span>المتاجر المرصودة</span><b>56 <small>مركزاً تجارياً</small></b><small>ضمن الحيز البلدي</small></div><div class="k a"><span>تنبيهات الأسعار</span><b>${IT.filter(over).length} <small>إشعارات</small></b><small>مواد فوق السعر الرسمي</small></div></div>
${chart()}
<div class="card"><h2>تغيّر الأسعار خلال أسبوع</h2>${IT.map(i=>{const a=ser(i,'w'),c=(a[6]-a[0])/a[0]*100;return`<div class="row" style="padding:10px 0;border-top:1px solid var(--bd);margin-top:8px"><div><b>${i.n}</b><div class="sub">من ${fmt(a[0])} إلى ${fmt(a[6])}</div></div><div style="text-align:left"><b>${c>=0?'+':''}${c.toFixed(1)}%</b><br><span class="tag ${over(i)?'w':''}">${over(i)?'فوق السعر الرسمي':'مستقر'}</span></div></div>`}).join('')}</div>`
};
const wform=()=>`<div class="card"><h2>تحديث سعر الجملة / مادة جديدة</h2><label>المادة</label><select id="wi"><option value="-1">+ مادة جديدة</option>${IT.map((x,k)=>`<option value="${k}">${x.n}</option>`).join('')}</select>
<div id="wn"><label>اسم المادة</label><input id="wname"><label>الشركة الموردة</label><input id="wco"><label>الوحدة</label><input id="wu" value="1 كغ"><label>التصنيف</label><select id="wc"><option value="1">مواد غذائية أساسية</option><option value="2">حبوب وبقوليات</option><option value="3">زيوت وسُمون</option></select><label>السعر الرسمي للمستهلك (ل.س)</label><input id="wcap" inputmode="numeric"><label>الباركود (اختياري)</label><input id="wbc" inputmode="numeric" value="${st.bc||''}"></div>
<label>سعر الجملة (ل.س)</label><input id="wpr" inputmode="numeric"><button class="btn" id="wsv" style="margin:14px 0 0">حفظ</button></div>`;
const scan=async()=>{const ov=document.getElementById('ov'),v=document.getElementById('vid'),msg=document.getElementById('smsg');ov.classList.remove('hide');let stream;
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play()}catch(e){msg.textContent='تعذّر فتح الكاميرا. اسمح للمتصفح باستخدام الكاميرا، أو اكتب رقم الباركود.';return}
window._stop=()=>stream.getTracks().forEach(t=>t.stop());
if(!('BarcodeDetector' in window)){msg.textContent='المتصفح لا يقرأ الباركود تلقائياً. اكتب الرقم يدوياً.';return}
const det=new BarcodeDetector();msg.textContent='وجّه الكاميرا نحو الباركود...';
const tick=async()=>{if(ov.classList.contains('hide'))return;try{const r=await det.detect(v);if(r.length){found(r[0].rawValue);return}}catch(e){}setTimeout(tick,300)};tick()};
function closeScan(){document.getElementById('ov').classList.add('hide');if(window._stop){window._stop();window._stop=null}}
function found(c){c=String(c).trim();if(!c)return;closeScan();if(IT.some(x=>x.bc==c)){show('home');const q=document.getElementById('q');q.value=c;q.oninput()}else if(confirm('الباركود '+c+' غير مسجل. هل تريد إضافته كمادة جديدة؟')){st.bc=c;st.wf=1;show('wholesale')}}
const m=document.getElementById('m'),nav=document.getElementById('nav');let cur='login';
function show(s){cur=s;const lo=s==='login';m.innerHTML=S[s]();m.scrollTop=0;document.getElementById('sub').textContent=SUB[s];
nav.classList.toggle('hide',lo);document.getElementById('fab').classList.toggle('lo',lo);
nav.innerHTML=TABS.map(t=>`<button class="${t[0]==s?'on':''}" data-go="${t[0]}">${ic(t[0]=='home'?'home':t[0]=='retail'?'bag':t[0]=='wholesale'?'store':'shield')}${t[1]}</button>`).join('');
m.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{st.role=b.dataset.role;show('login')});
m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{st.i=+b.dataset.i;show(cur)});
m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.p=b.dataset.p;show(cur)});
m.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{st.cat=+b.dataset.cat;show(cur)});
const g=document.getElementById('go');if(g)g.onclick=()=>show(st.role);
const sv=document.getElementById('sv');if(sv)sv.onclick=()=>{const it=IT[document.getElementById('ri').value],p=+document.getElementById('rp').value||0,o=p>it.cap;if(p>0){it.w=it.w.slice(1).concat(p);save()}st.done=`<div class="card ${o?'bad':''}" style="border-color:${o?'#f3b4b4':'#bbf7d0'}"><div class="row"><h2>${o?'السعر أعلى من '+it.L:'تم توثيق سعر التجزئة بنجاح'}</h2><span class="tag ${o?'w':''}">إشعار فوري</span></div><div class="sub" style="margin-top:6px">${it.n}: ${fmt(p)} ل.س مقابل ${it.L} ${fmt(it.cap)} ل.س</div></div>`;show('retail')};
const aw=document.getElementById('addw');if(aw)aw.onclick=()=>{st.wf=!st.wf;show('wholesale')};
const wi=document.getElementById('wi');if(wi)wi.onchange=()=>document.getElementById('wn').classList.toggle('hide',wi.value!='-1');
const ws=document.getElementById('wsv');if(ws)ws.onclick=()=>{const g=x=>document.getElementById(x).value.trim(),ix=+g('wi'),pr=+g('wpr');if(!pr){alert('أدخل سعر الجملة');return}
if(ix<0){const nm=g('wname');if(!nm){alert('أدخل اسم المادة');return}const cap=+g('wcap')||pr;IT.push({n:nm,s:nm.split(' ')[0],u:g('wu')||'1 كغ',d:'مادة مسجلة حديثاً',cap,L:'السعر الرسمي النافذ',cat:+g('wc'),co:g('wco')||'-',wp:fmt(pr),bc:g('wbc'),w:Array(7).fill(cap)})}else IT[ix].wp=fmt(pr);
save();st.wf=0;st.bc='';show('wholesale')};
const sc=document.getElementById('scan');if(sc)sc.onclick=scan;
const q=document.getElementById('q');if(q)q.oninput=()=>{document.getElementById('lst').innerHTML=IT.filter(x=>(x.n+' '+(x.bc||'')+' '+x.s).includes(q.value.trim())).map(card).join('')||'<div class="sub">لا نتائج</div>'};
const rs=document.getElementById('rst');if(rs)rs.onclick=()=>{try{localStorage.removeItem('ain_v1')}catch(e){}location.reload()};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{st.done=null;show(b.dataset.go)});}
document.getElementById('out').innerHTML=ic('user');document.getElementById('out').onclick=()=>show('login');
document.getElementById('ni').innerHTML=ic('info',16);document.getElementById('fi').innerHTML=ic('phone',18);
show('login');
</script></body></html>
