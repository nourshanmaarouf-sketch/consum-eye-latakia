body{font-size:15px!important}
h2{font-size:17px!important}.sub{font-size:13px!important}.note{font-size:12px!important;padding:6px 14px!important}
.pr span,.k span,.k small,.sum span{font-size:13px!important}.tag{font-size:12.5px!important}.chip{font-size:14px!important}
nav button{font-size:12.5px!important}.fab{font-size:13.5px!important}
.role b{font-size:15px!important}.role small{font-size:12.5px!important}.k b{font-size:24px!important}
header small{display:none!important}header b{font-size:17px!important}header span{font-size:12.5px!important}.sb{font-size:13px!important}
.btn{background:#0e2b20!important;box-shadow:none!important;border:0!important;border-radius:10px!important;font-size:15px!important}
.btn.red{background:#fff!important;color:#a91818!important;border:1px solid #a91818!important;padding:10px 14px!important;font-size:13.5px!important}
.btn.red small{font-size:12.5px!important}
.card,.k{box-shadow:none!important;border-radius:10px!important}
</style><style>header span{display:none!important}</style><style>
textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:#f7faf6;font:inherit;color:var(--tx);min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;margin:6px 0 4px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:#fff;border-radius:10px;font:inherit;font-size:13px;color:var(--tx)}.seg button.on{background:var(--dk);color:#fff;border-color:var(--dk);font-weight:800}
.empty{text-align:center;color:var(--mut)}.empty b{display:block;color:var(--tx);margin-bottom:4px}
.li{padding:11px 0;border-top:1px solid var(--bd)}.li:first-child{border-top:0}
.btn.sm{width:auto;padding:8px 14px;font-size:13px!important;margin:0;display:inline-flex}
.btn.ghost{background:#fff!important;color:var(--dk)!important;border:1px solid var(--dk)!important}
.btn.dng{background:#fff!important;color:#a91818!important;border:1px solid #a91818!important}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:18px;color:var(--tx)}.qty b{min-width:22px;text-align:center}
.ph{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.7}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.banner.w{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.banner.e{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.banner.g{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--gr);font-weight:700;padding:0 0 12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:13.5px}.kv:first-of-type{border-top:0}.kv span{color:var(--mut)}
.lnk{color:var(--gr);font-weight:700;background:none;border:0;font:inherit;padding:0}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nb{position:absolute;top:2px;margin-inline-start:14px;background:#ba1a1a;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
nav button{position:relative}
