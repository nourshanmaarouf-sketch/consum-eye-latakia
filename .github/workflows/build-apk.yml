name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/
          cp manifest.webmanifest sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init ConsumerEye com.latakia.consumereye --web-dir www
          npx cap add android
          npx cap sync android

      - name: App name, icon and camera permission
        run: |
          RES=android/app/src/main/res
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">عين المستهلك</string>|' $RES/values/strings.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
          done
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: consumer-eye-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
